<!doctype html><html lang="fr"><meta charset="utf-8"><title>Meowza · contrôle des formats</title><style>body{margin:0;background:#e8e1db;font:16px system-ui;color:#51425f}header{padding:12px;display:flex;gap:12px;align-items:center}button{padding:9px}iframe{display:block;margin:0 auto;border:0;background:#fff6ee}p{margin:0}</style><header><strong>Contrôle des formats</strong><button data-w="390" data-h="844">Téléphone haut</button><button data-w="360" data-h="640">Téléphone compact</button><button data-w="768" data-h="1024">Tablette</button><button data-w="1280" data-h="800">Paysage</button><p id="size">390 × 844</p></header><iframe title="Meowza" src="./" width="390" height="844"></iframe><script>for(const b of document.querySelectorAll('button'))b.onclick=()=>{const f=document.querySelector('iframe');f.width=b.dataset.w;f.height=b.dataset.h;document.querySelector('#size').textContent=f.width+' × '+f.height;};</script></html>
